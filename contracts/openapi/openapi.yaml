openapi: 3.0.3
info:
  title: Wishiz API
  version: 0.2.0
  description: Wishlist backend MVP for the Wishiz mobile app.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status
  /scrape:
    get:
      summary: Scrape product details from a product URL
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Scraped product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapedProduct'
        '400':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/InternalError'
  /wishlists:
    get:
      summary: List wishlists
      responses:
        '200':
          description: Wishlist aggregates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wishlist'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWishlistRequest'
      responses:
        '201':
          description: Wishlist created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
    get:
      summary: Get a wishlist by ID
      responses:
        '200':
          description: Wishlist aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Update wishlist fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWishlistRequest'
      responses:
        '200':
          description: Updated wishlist aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a wishlist
      responses:
        '204':
          description: Wishlist deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
    post:
      summary: Archive a wishlist
      responses:
        '200':
          description: Archived wishlist aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
    post:
      summary: Restore an archived wishlist
      responses:
        '200':
          description: Restored wishlist aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}/items:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
    post:
      summary: Add an item to a wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWishlistItemRequest'
      responses:
        '201':
          description: Wishlist item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
      - $ref: '#/components/parameters/ItemID'
    patch:
      summary: Update a wishlist item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWishlistItemRequest'
      responses:
        '200':
          description: Updated wishlist item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistItemNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a wishlist item
      responses:
        '204':
          description: Wishlist item deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistItemNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}/items/reorder:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
    post:
      summary: Reorder wishlist items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderWishlistItemsRequest'
      responses:
        '200':
          description: Updated wishlist aggregate after reorder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}/join:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
    post:
      summary: Join a wishlist with an invite token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinWishlistRequest'
      responses:
        '200':
          description: Joined wishlist aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wishlist'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}/invites:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
    post:
      summary: Create a wishlist invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWishlistInviteRequest'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistInvite'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
      - $ref: '#/components/parameters/InviteID'
    delete:
      summary: Delete a wishlist invite
      responses:
        '204':
          description: Invite deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /wishlists/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WishlistID'
      - $ref: '#/components/parameters/UserID'
    delete:
      summary: Remove a wishlist member
      responses:
        '204':
          description: Member removed
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/WishlistNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    WishlistID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemID:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteID:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Validation or malformed request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WishlistNotFound:
      description: Wishlist was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WishlistItemNotFound:
      description: Wishlist item was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Wishlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        year:
          type: integer
        coverImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isArchived:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/WishlistMember'
        invites:
          type: array
          items:
            $ref: '#/components/schemas/WishlistInvite'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WishlistItem'
      required:
        - id
        - ownerUserId
        - title
        - description
        - year
        - createdAt
        - updatedAt
        - isArchived
        - members
        - invites
        - items
    WishlistMember:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [viewer, editor]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - email
        - fullName
        - role
        - createdAt
        - updatedAt
    WishlistInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [viewer, editor]
        invitedByUserId:
          type: string
          format: uuid
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        token:
          type: string
          description: Returned only when an invite is created.
      required:
        - id
        - email
        - role
        - expiresAt
        - createdAt
        - updatedAt
    WishlistItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        rank:
          type: integer
        notes:
          type: string
          nullable: true
        priceLabel:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [saved, considering, purchased]
        imageUrl:
          type: string
          nullable: true
        productUrl:
          type: string
          nullable: true
        purchasedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - rank
        - priority
        - status
        - createdAt
        - updatedAt
    CreateWishlistRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        year:
          type: integer
        coverImageUrl:
          type: string
          nullable: true
      required:
        - title
        - year
    PatchWishlistRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        year:
          type: integer
        coverImageUrl:
          type: string
          nullable: true
      additionalProperties: false
    CreateWishlistItemRequest:
      type: object
      properties:
        title:
          type: string
        notes:
          type: string
          nullable: true
        priceLabel:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [saved, considering, purchased]
        imageUrl:
          type: string
          nullable: true
        productUrl:
          type: string
          nullable: true
      required:
        - title
    PatchWishlistItemRequest:
      type: object
      properties:
        title:
          type: string
        notes:
          type: string
          nullable: true
        priceLabel:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
        status:
          type: string
          enum: [saved, considering, purchased]
        imageUrl:
          type: string
          nullable: true
        productUrl:
          type: string
          nullable: true
      additionalProperties: false
    ReorderWishlistItemsRequest:
      type: object
      properties:
        orderedItemIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - orderedItemIds
    JoinWishlistRequest:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    CreateWishlistInviteRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [viewer, editor]
        expiresAt:
          type: string
          format: date-time
      required:
        - email
        - role
    ScrapedProduct:
      type: object
      properties:
        name:
          type: string
        priceAmount:
          type: string
        priceCurrency:
          type: string
        imageUrl:
          type: string
        source:
          type: string
          enum: [fast, headless]
      required:
        - name
        - priceAmount
        - priceCurrency
        - imageUrl
        - source
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
          required:
            - code
            - message
      required:
        - error
