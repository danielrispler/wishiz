services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wishiz
      POSTGRES_USER: wishiz
      POSTGRES_PASSWORD: WishizPg_2026_7x9kLq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishiz -d wishiz"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wishiz
      MINIO_ROOT_PASSWORD: WishizMinio_2026_7x9kLq
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 wishiz WishizMinio_2026_7x9kLq; do sleep 1; done
        mc mb --ignore-existing local/wishiz-images
        mc anonymous set download local/wishiz-images

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://wishiz:WishizPg_2026_7x9kLq@postgres:5432/wishiz?sslmode=disable
      RUN_DB_MIGRATIONS: "true"
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: wishiz-images
      STORAGE_S3_ACCESS_KEY_ID: wishiz
      STORAGE_S3_SECRET_ACCESS_KEY: WishizMinio_2026_7x9kLq
      STORAGE_S3_USE_PATH_STYLE: "true"
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:?STORAGE_PUBLIC_BASE_URL must be set to a publicly reachable URL (e.g. https://storage.example.com)}
      UPLOADS_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data:
