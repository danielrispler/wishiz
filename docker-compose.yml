services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wishiz}
      POSTGRES_USER: ${POSTGRES_USER:-wishiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wishiz} -d ${POSTGRES_DB:-wishiz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      # Local monolith: every route + all in-process loops + boot-migrate.
      SERVICE_ROLE: ${SERVICE_ROLE:-all}
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      # Uploads are off by default locally (no GCS needed to run). To exercise
      # them, run a fsouza/fake-gcs-server, set STORAGE_EMULATOR_HOST + BUCKET_NAME
      # (the Go GCS SDK honours STORAGE_EMULATOR_HOST), and flip UPLOADS_ENABLED on.
      UPLOADS_ENABLED: ${UPLOADS_ENABLED:-false}
      BUCKET_NAME: ${BUCKET_NAME:-}
      GCS_PUBLIC_BASE_URL: ${GCS_PUBLIC_BASE_URL:-https://storage.googleapis.com}
      STORAGE_EMULATOR_HOST: ${STORAGE_EMULATOR_HOST:-}
      SHARE_BASE_URL: ${SHARE_BASE_URL:-https://wishiz.app}
      ZENROWS_API_KEY: ${ZENROWS_API_KEY:-}
      ZENROWS_TIMEOUT: ${ZENROWS_TIMEOUT:-30s}
    ports:
      - "${API_BIND_ADDR:-0.0.0.0}:8080:8080"

volumes:
  postgres_data:
