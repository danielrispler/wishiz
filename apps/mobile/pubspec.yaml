name: wishiz
description: A Wishlist Manager App.
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  google_fonts: ^8.0.2
  html: ^0.15.6
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
