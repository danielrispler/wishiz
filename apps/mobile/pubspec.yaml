name: wishiz
description: A Wishlist Manager App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  google_fonts: ^6.1.0
  image_picker: ^1.1.2
  share_plus: ^7.2.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
