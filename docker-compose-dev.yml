services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wishiz
      POSTGRES_USER: wishiz
      POSTGRES_PASSWORD: wishiz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishiz -d wishiz"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://wishiz:wishiz@postgres:5432/wishiz?sslmode=disable
      RUN_DB_MIGRATIONS: "true"
    ports:
      - "8080:8080"

  api-dev:
    image: golang:1.23-alpine
    working_dir: /workspace
    volumes:
      - ./apps/api:/workspace

  api-lint:
    image: golangci/golangci-lint:v1.64.8
    working_dir: /workspace
    volumes:
      - ./apps/api:/workspace

volumes:
  postgres_data:
