services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wishiz
      POSTGRES_USER: wishiz
      POSTGRES_PASSWORD: WishizPg_2026_7x9kLq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishiz -d wishiz"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://wishiz:WishizPg_2026_7x9kLq@postgres:5432/wishiz?sslmode=disable
      RUN_DB_MIGRATIONS: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data: