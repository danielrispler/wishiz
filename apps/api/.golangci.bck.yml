linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment # This can be noisy
  gocyclo:
    min-complexity: 20
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  lll:
    line-length: 120
  goimports:
    local-prefixes: github.com/danielrispler/wishiz/apps/api
  unparam:
    check-exported: false
  nakedret:
    max-func-lines: 30
  prealloc:
    simple: true
    range-loops: true
    for-loops: false
  gocritic:
    enabled-tags:
      - diagnostic
      - style
    disabled-checks:
      - paramTypeCombine
      - wrapperFunc

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - revive
    - gofmt
    - goimports
    - misspell
    - gocritic
    - goconst
    - gocyclo
    - asciicheck
    - prealloc
    - bidichk
    - bodyclose
    - dogsled
    - durationcheck
    - errname
    - errorlint
    - forcetypeassert
    - makezero
    - nilerr
    - nilnil
    - noctx
    - paralleltest
    - unconvert
    - unparam
    - wastedassign
  disable-all: true

run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - goconst
